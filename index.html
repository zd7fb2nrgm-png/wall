<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근황토크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fdf6ee; --card-bg:#ffffff; --accent:#FE6B01; --text:#1a1008; --text-muted:#9b7355; --border:#f0ddd0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); font-family:'Noto Sans KR',sans-serif; font-weight:400; min-height:100vh; padding-bottom:100px; }
  .header { text-align:center; padding:48px 24px 32px; border-bottom:1px solid var(--border); position:relative; }
  .header::after { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:60px; height:3px; background:var(--accent); border-radius:2px; }
  .header img { width:160px; margin-bottom:16px; opacity:0.9; display:block; margin-left:auto; margin-right:auto; }
  .header h1 { font-family:'Noto Serif KR',serif; font-size:clamp(22px,5vw,28px); font-weight:600; color:var(--text); margin-bottom:8px; }
  .header p { font-size:16px; color:var(--text-muted); line-height:1.7; }
  .admin-btn { position:fixed; top:16px; right:16px; background:none; border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12px; color:var(--text-muted); cursor:pointer; z-index:100; transition:all 0.2s; }
  .admin-btn:hover { border-color:var(--accent); color:var(--accent); }
  .admin-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .wall-wrap { max-width:960px; margin:36px auto 0; padding:0 20px; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media(max-width:900px) { .wall-wrap { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:600px) { .wall-wrap { grid-template-columns:1fr; } }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:20px; animation:fadeIn 0.4s ease; transition:border-color 0.2s,transform 0.2s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }
  .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .card-name { font-size:16px; font-weight:500; color:var(--accent); }
  .card-time { font-size:13px; color:var(--text-muted); }
  .card-text { font-size:16px; color:var(--text); line-height:1.8; word-break:keep-all; margin-bottom:14px; }
  .card-admin-btns { display:none; gap:6px; margin-top:8px; padding-top:12px; border-top:1px solid var(--border); }
  .card-admin-btns.visible { display:flex; }
  .btn-edit,.btn-delete,.btn-pin { flex:1; padding:7px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:all 0.2s; }
  .btn-edit { background:var(--bg); border:1px solid var(--border); color:var(--text); }
  .btn-edit:hover { border-color:var(--accent); color:var(--accent); }
  .btn-delete { background:#fff0f0; border:1px solid #ffcccc; color:#e53935; }
  .btn-delete:hover { background:#ffe0e0; }

  /* 댓글 */
  .comment-toggle { display:flex; align-items:center; gap:6px; background:none; border:none; font-size:13px; color:var(--text-muted); cursor:pointer; padding:0; font-family:'Noto Sans KR',sans-serif; transition:color 0.2s; }
  .comment-toggle:hover { color:var(--accent); }
  .comment-toggle.open { color:var(--accent); font-weight:500; }
  .comment-section { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .comment-section.open { display:block; }
  .comment-item { background:var(--bg); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .comment-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .comment-name { font-size:13px; font-weight:500; color:var(--text); }
  .comment-time { font-size:11px; color:var(--text-muted); }
  .comment-text { font-size:13px; color:var(--text); line-height:1.6; }
  .comment-delete { background:none; border:none; font-size:11px; color:#e53935; cursor:pointer; display:none; padding:2px 6px; }
  .comment-delete.visible { display:inline-block; }
  .comment-form { margin-top:10px; }
  .comment-form input { width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-family:'Noto Sans KR',sans-serif; font-size:13px; color:var(--text); background:var(--card-bg); outline:none; margin-bottom:6px; }
  .comment-form input:focus { border-color:var(--accent); }
  .comment-input-row { display:flex; gap:6px; }
  .comment-input-row input { flex:1; margin-bottom:0; }
  .comment-submit { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; white-space:nowrap; }
  .comment-submit:hover { background:#e05500; }

  .loading { text-align:center; padding:60px; color:var(--text-muted); font-size:16px; grid-column:1/-1; }
  .empty { text-align:center; padding:80px 24px; color:var(--text-muted); font-size:16px; line-height:1.8; grid-column:1/-1; }
  .pagination-wrap { max-width:960px; margin:28px auto 0; padding:0 20px; }
  .page-info { text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:12px; }
  .pagination { display:flex; justify-content:center; align-items:center; gap:6px; }
  .page-btn { width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); font-size:14px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:all 0.2s; }
  .page-btn:hover { border-color:var(--accent); color:var(--accent); }
  .page-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500; }
  .page-btn:disabled { opacity:0.3; cursor:not-allowed; }
  .fab { position:fixed; bottom:32px; right:28px; background:var(--accent); color:#fff; border:none; border-radius:50px; padding:14px 22px; font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:500; cursor:pointer; box-shadow:0 4px 20px rgba(254,107,1,0.35); display:flex; align-items:center; gap:8px; transition:background 0.2s,transform 0.2s; z-index:100; }
  .fab:hover { background:#e05500; transform:translateY(-2px); }
  .modal-overlay { position:fixed; inset:0; background:rgba(26,16,8,0.45); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s; padding:20px; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--card-bg); border-radius:20px; padding:32px 28px 28px; width:100%; max-width:480px; box-shadow:0 16px 48px rgba(26,16,8,0.18); transform:translateY(20px) scale(0.97); transition:transform 0.25s; position:relative; }
  .modal-overlay.open .modal { transform:translateY(0) scale(1); }
  .modal-title { font-family:'Noto Serif KR',serif; font-size:20px; font-weight:600; color:var(--text); margin-bottom:6px; }
  .modal-sub { font-size:15px; color:var(--text-muted); margin-bottom:24px; line-height:1.6; }
  .modal input,.modal textarea { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-family:'Noto Sans KR',sans-serif; font-size:16px; font-weight:400; color:var(--text); background:var(--bg); outline:none; transition:border-color 0.2s; resize:none; }
  .modal input:focus,.modal textarea:focus { border-color:var(--accent); }
  .modal input { margin-bottom:12px; }
  .modal textarea { height:120px; margin-bottom:4px; }
  .char-count { text-align:right; font-size:12px; color:var(--text-muted); margin-bottom:16px; }
  .char-count.over { color:#e53935; }
  .modal-btns { display:flex; gap:10px; }
  .btn-cancel { flex:1; background:var(--bg); color:var(--text-muted); border:1px solid var(--border); border-radius:10px; padding:13px; font-family:'Noto Sans KR',sans-serif; font-size:15px; cursor:pointer; }
  .btn-cancel:hover { background:#f0ddd0; }
  .btn-submit { flex:2; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px; font-family:'Noto Sans KR',sans-serif; font-size:15px; font-weight:500; cursor:pointer; }
  .btn-submit:hover { background:#e05500; }
  .btn-submit:disabled { background:#ccc; cursor:not-allowed; }
  .modal-close { position:absolute; top:16px; right:18px; background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; }
  .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:#1a1008; color:#fff; padding:12px 24px; border-radius:30px; font-size:14px; opacity:0; transition:all 0.3s; z-index:999; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">관리자</button>

<div class="header">
  <img src="logo.png" alt="월드비전 로고">
  <h1>💬 근황토크</h1>
  <p>어떻게 지내셨어요? 잘 계셨나요?</p>
</div>

<div class="wall-wrap" id="postList"><div class="loading">불러오는 중...</div></div>

<div class="pagination-wrap">
  <div class="page-info" id="pageInfo"></div>
  <div class="pagination" id="pagination"></div>
</div>

<button class="fab" onclick="openModal()"><span>✏️</span> 근황 남기기</button>

<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">근황토크 💬</div>
    <div class="modal-sub">어떻게 지내셨어요? 편하게 남겨주세요!</div>
    <input type="text" id="nameInput" placeholder="이름 또는 닉네임" maxlength="20">
    <textarea id="msgInput" placeholder="내용을 입력하세요 (400자 이내)" maxlength="400"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 400</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-submit" id="submitBtn" onclick="submitPost()">남기기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editOverlay" onclick="handleEditOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <div class="modal-title">수정하기 ✏️</div>
    <div class="modal-sub">내용을 수정해주세요</div>
    <input type="text" id="editNameInput" placeholder="이름 또는 닉네임" maxlength="20">
    <textarea id="editMsgInput" placeholder="내용을 입력하세요 (400자 이내)" maxlength="400"></textarea>
    <div class="char-count"><span id="editCharCount">0</span> / 400</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="btn-submit" id="editSubmitBtn" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, deleteDoc, doc, updateDoc, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTvllxgNdlScAn-1UdPlrlLL61EwU9AK_8",
    authDomain: "th-4fa89.firebaseapp.com",
    projectId: "th-4fa89",
    storageBucket: "th-4fa89.firebasestorage.app",
    messagingSenderId: "950541937241",
    appId: "1:950541937241:web:8a6760b4509502be4a1f48",
    measurementId: "G-GMDM7RDPMS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let isAdmin = false;
  let currentEditId = null;
  let allPosts = [];
  let currentPage = 1;

  function getPageSize() {
    if (window.innerWidth <= 600) return 6;
    if (window.innerWidth <= 900) return 8;
    return 12;
  }

  function renderPage() {
    const pageSize = getPageSize();
    const totalPages = Math.max(1, Math.ceil(allPosts.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * pageSize;
    const pagePosts = allPosts.slice(start, start + pageSize);
    const list = document.getElementById('postList');
    list.innerHTML = '';

    if (allPosts.length === 0) {
      list.innerHTML = '<div class="empty">아직 근황이 없어요.<br>첫 번째 근황을 남겨보세요 ✨</div>';
      document.getElementById('pageInfo').textContent = '';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    pagePosts.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      if (d.pinned) card.style.borderColor = '#FE6B01';
      card.innerHTML = `
        <div class="card-top">
          <span class="card-name">${d.pinned ? '📌 ' : ''}${escapeHtml(d.name)}</span>
          <span class="card-time">${d.time}</span>
        </div>
        <div class="card-text">${escapeHtml(d.msg)}</div>
        <button class="comment-toggle" onclick="toggleComments(this, '${d.id}')">
          💬 댓글 <span class="cmt-count" id="cmt-count-${d.id}">0</span>개
        </button>
        <div class="comment-section" id="comments-${d.id}">
          <div class="comment-list" id="comment-list-${d.id}"></div>
          <div class="comment-form">
            <input type="text" placeholder="이름" id="cmt-name-${d.id}" maxlength="20">
            <div class="comment-input-row">
              <input type="text" placeholder="댓글을 남겨주세요" id="cmt-text-${d.id}" maxlength="200">
              <button class="comment-submit" onclick="submitComment('${d.id}')">등록</button>
            </div>
          </div>
        </div>
        <div class="card-admin-btns ${isAdmin ? 'visible' : ''}">
          <button class="btn-edit" onclick="openEditModal('${d.id}', '${escapeAttr(d.name)}', '${escapeAttr(d.msg)}')">✏️ 수정</button>
          <button class="btn-pin" onclick="togglePin('${d.id}', ${d.pinned})" style="flex:1;padding:7px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;background:${d.pinned ? '#fff8e1' : 'var(--bg)'};border:1px solid ${d.pinned ? '#ffc107' : 'var(--border)'};color:${d.pinned ? '#f59e0b' : 'var(--text-muted)'};">${d.pinned ? '📌 고정해제' : '📌 고정'}</button>
          <button class="btn-delete" onclick="deletePost('${d.id}')">🗑️ 삭제</button>
        </div>
      `;
      list.appendChild(card);
      loadComments(d.id);
    });

    document.getElementById('pageInfo').textContent = `총 ${allPosts.length}개 · ${currentPage} / ${totalPages} 페이지`;
    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    const prev = document.createElement('button');
    prev.className = 'page-btn'; prev.textContent = '‹'; prev.disabled = currentPage === 1;
    prev.onclick = () => { currentPage--; renderPage(); window.scrollTo(0,0); };
    pagination.appendChild(prev);

    let pages = [];
    if (totalPages <= 5) { for (let i=1;i<=totalPages;i++) pages.push(i); }
    else {
      pages = [1];
      if (currentPage > 3) pages.push('...');
      for (let i=Math.max(2,currentPage-1);i<=Math.min(totalPages-1,currentPage+1);i++) pages.push(i);
      if (currentPage < totalPages-2) pages.push('...');
      pages.push(totalPages);
    }
    pages.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
      btn.textContent = p;
      if (p === '...') { btn.disabled = true; btn.style.border='none'; btn.style.background='none'; }
      else btn.onclick = () => { currentPage = p; renderPage(); window.scrollTo(0,0); };
      pagination.appendChild(btn);
    });

    const next = document.createElement('button');
    next.className = 'page-btn'; next.textContent = '›'; next.disabled = currentPage === totalPages;
    next.onclick = () => { currentPage++; renderPage(); window.scrollTo(0,0); };
    pagination.appendChild(next);
  }

  window.addEventListener('resize', renderPage);

  // 댓글 토글
  window.toggleComments = function(btn, postId) {
    const section = document.getElementById('comments-' + postId);
    const isOpen = section.classList.contains('open');
    section.classList.toggle('open');
    btn.classList.toggle('open');
  };

  // 댓글 로드
  function loadComments(postId) {
    const q = query(collection(db, 'posts', postId, 'comments'), orderBy('createdAt', 'asc'));
    onSnapshot(q, snapshot => {
      const countEl = document.getElementById('cmt-count-' + postId);
      const listEl = document.getElementById('comment-list-' + postId);
      if (!countEl || !listEl) return;
      countEl.textContent = snapshot.size;
      listEl.innerHTML = '';
      snapshot.forEach(docSnap => {
        const c = docSnap.data();
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-top">
            <span class="comment-name">${escapeHtml(c.name)}</span>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="comment-time">${c.createdAt ? formatTime(c.createdAt.toDate()) : ''}</span>
              <button class="comment-delete ${isAdmin ? 'visible' : ''}" onclick="deleteComment('${postId}','${docSnap.id}')">삭제</button>
            </div>
          </div>
          <div class="comment-text">${escapeHtml(c.text)}</div>
        `;
        listEl.appendChild(item);
      });
    });
  }

  // 댓글 등록
  window.submitComment = async function(postId) {
    const nameEl = document.getElementById('cmt-name-' + postId);
    const textEl = document.getElementById('cmt-text-' + postId);
    const name = nameEl.value.trim();
    const text = textEl.value.trim();
    if (!name) { showToast('이름을 입력해주세요'); return; }
    if (!text) { showToast('댓글을 입력해주세요'); return; }
    try {
      await addDoc(collection(db, 'posts', postId, 'comments'), { name, text, createdAt: serverTimestamp() });
      nameEl.value = ''; textEl.value = '';
      showToast('댓글이 등록되었어요 💬');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
  };

  // 댓글 삭제 (관리자)
  window.deleteComment = async function(postId, commentId) {
    if (!confirm('댓글을 삭제할까요?')) return;
    try {
      await deleteDoc(doc(db, 'posts', postId, 'comments', commentId));
      showToast('댓글이 삭제되었어요');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
  };

  // 관리자
  window.toggleAdmin = function() {
    if (isAdmin) {
      isAdmin = false;
      document.getElementById('adminBtn').classList.remove('active');
      document.getElementById('adminBtn').textContent = '관리자';
      renderPage(); showToast('관리자 모드 해제'); return;
    }
    const pw = prompt('관리자 비밀번호를 입력하세요');
    if (pw === '3160') {
      isAdmin = true;
      document.getElementById('adminBtn').classList.add('active');
      document.getElementById('adminBtn').textContent = '관리자 모드 ON';
      renderPage(); showToast('관리자 모드 활성화 ✅');
    } else if (pw !== null) { showToast('비밀번호가 틀렸어요'); }
  };

  // 글자수
  const msgInput = document.getElementById('msgInput');
  const charCount = document.getElementById('charCount');
  msgInput.addEventListener('input', () => {
    const len = msgInput.value.length;
    charCount.textContent = len;
    charCount.parentElement.className = 'char-count' + (len > 400 ? ' over' : '');
  });
  const editMsgInput = document.getElementById('editMsgInput');
  const editCharCount = document.getElementById('editCharCount');
  editMsgInput.addEventListener('input', () => {
    const len = editMsgInput.value.length;
    editCharCount.textContent = len;
    editCharCount.parentElement.className = 'char-count' + (len > 400 ? ' over' : '');
  });

  window.openModal = function() { document.getElementById('modalOverlay').classList.add('open'); document.getElementById('nameInput').focus(); };
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('open'); };
  window.handleOverlayClick = function(e) { if (e.target===document.getElementById('modalOverlay')) closeModal(); };
  window.openEditModal = function(id, name, msg) {
    currentEditId = id;
    document.getElementById('editNameInput').value = name;
    document.getElementById('editMsgInput').value = msg;
    editCharCount.textContent = msg.length;
    document.getElementById('editOverlay').classList.add('open');
  };
  window.closeEditModal = function() { document.getElementById('editOverlay').classList.remove('open'); currentEditId = null; };
  window.handleEditOverlayClick = function(e) { if (e.target===document.getElementById('editOverlay')) closeEditModal(); };
  document.addEventListener('keydown', e => { if (e.key==='Escape') { closeModal(); closeEditModal(); } });

  window.submitPost = async function() {
    const name = document.getElementById('nameInput').value.trim() || '익명';
    const msg = msgInput.value.trim();
    if (!msg) { showToast('내용을 입력해주세요 😊'); return; }
    if (msg.length > 400) { showToast('400자 이내로 입력해주세요'); return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '올리는 중...';
    try {
      await addDoc(collection(db, 'posts'), { name, msg, pinned: false, createdAt: serverTimestamp() });
      document.getElementById('nameInput').value = '';
      msgInput.value = ''; charCount.textContent = '0';
      currentPage = 1; closeModal(); showToast('근황이 등록되었어요 🎉');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
    btn.disabled = false; btn.textContent = '남기기';
  };

  window.saveEdit = async function() {
    const name = document.getElementById('editNameInput').value.trim() || '익명';
    const msg = editMsgInput.value.trim();
    if (!msg) { showToast('내용을 입력해주세요'); return; }
    const btn = document.getElementById('editSubmitBtn');
    btn.disabled = true; btn.textContent = '저장 중...';
    try {
      await updateDoc(doc(db, 'posts', currentEditId), { name, msg });
      closeEditModal(); showToast('수정되었어요 ✅');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
    btn.disabled = false; btn.textContent = '저장';
  };

  window.togglePin = async function(id, isPinned) {
    try {
      await updateDoc(doc(db, 'posts', id), { pinned: !isPinned });
      showToast(isPinned ? '고정 해제되었어요' : '고정되었어요 📌');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
  };

  window.deletePost = async function(id) {
    if (!confirm('정말 삭제할까요?')) return;
    try {
      await deleteDoc(doc(db, 'posts', id));
      showToast('삭제되었어요');
    } catch(e) { showToast('오류가 발생했어요.'); console.error(e); }
  };

  const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  onSnapshot(q, snapshot => {
    allPosts = [];
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      allPosts.push({ id: docSnap.id, name: d.name, msg: d.msg, pinned: d.pinned || false, time: d.createdAt ? formatTime(d.createdAt.toDate()) : '' });
    });
    allPosts.sort((a,b) => { if(a.pinned&&!b.pinned) return -1; if(!a.pinned&&b.pinned) return 1; return 0; });
    renderPage();
  });

  function formatTime(date) {
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return '방금 전';
    if (diff < 3600) return Math.floor(diff/60) + '분 전';
    if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
    return `${date.getMonth()+1}/${date.getDate()}`;
  }
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;').replace(/\n/g,'<br>');
  }
  function escapeAttr(str) { return str.replace(/'/g,"\\'").replace(/\n/g,' '); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
